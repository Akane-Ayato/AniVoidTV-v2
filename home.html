<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnivoidTV — Watch Anime Online</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/effects.css">
<link rel="stylesheet" href="assets/decorations.css">
<link rel="stylesheet" href="assets/bannerfx.css">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/home.css">
</head>
<body class="home">

<header class="navbar home-nav">
  <div class="nav-left">
    <button class="hamburger" id="menu-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <a class="logo" href="home.html">
      <img class="logo-mark" src="assets/logo.jpg" alt="AnivoidTV logo">
      <div class="logo-word">Anivoid<span>TV</span></div>
    </a>
  </div>

  <form class="nav-search" id="nav-search" role="search" autocomplete="off">
    <div class="box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" placeholder="Search anime…" aria-label="Search anime" maxlength="100">
      <kbd>S</kbd>
    </div>
    <div class="sugg" id="sugg"></div>
  </form>

  <nav class="nav-links" aria-label="Quick links">
    <a href="recent.html">Recent</a>
    <a href="aired.html">Finished</a>
    <a href="upcoming.html">Upcoming</a>
    <a href="#schedule" title="Schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
    <button id="random-btn" type="button" title="Random anime"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
  </nav>

  <div class="nav-right">
    <button class="icon-btn" id="search-toggle" type="button" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <div id="nav-slot"></div>
  </div>
</header>

<div class="nav-overlay" id="nav-overlay"></div>
<aside class="nav-drawer" id="nav-drawer">
  <div class="drawer-head">
    <img class="logo-mark" src="assets/logo.jpg" alt="AnikotoTV logo">
    <div class="logo-word">Anivoid<span>TV</span></div>
  </div>
  <a class="drawer-link" data-page="home.html" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
  <a class="drawer-link" data-page="recent.html" href="recent.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>Recent</a>
  <a class="drawer-link" data-page="aired.html" href="aired.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>Finished Anime</a>
  <a class="drawer-link" data-page="upcoming.html" href="upcoming.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Upcoming Anime</a>
  <a class="drawer-link" data-page="search.html" href="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</a>
  <a class="drawer-link" data-page="index.html" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Watch by ID</a>
  <a class="drawer-link" data-telegram-link href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6c.2-1-.6-1.8-1.5-1.4L2.4 10.7c-1 .4-1 1.9.1 2.2l4.4 1.4 1.7 5.4c.2.7 1 .9 1.6.4l2.5-2.2 4.6 3.4c.8.6 1.9.1 2.1-.8l3.5-15.9z"/></svg>Telegram</a>
  <a class="drawer-link" data-contact-link href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Support</a>
  <div class="drawer-foot">AnivoidTV · Free anime</div>
</aside>

<!-- HERO / SPOTLIGHT -->
<section class="hero-h" id="hero" aria-label="Spotlight">
  <div class="hero-sk" id="hero-sk"></div>
  <div class="hero-nav" id="hero-nav" style="display:none">
    <button type="button" id="hero-prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <button type="button" id="hero-next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
</section>

<main class="home-wrap">
  <div class="home-grid">

    <section id="cw-section" aria-label="Continue watching"></section>

    <section class="latest" aria-label="Latest episodes">
      <div class="panel-h">
        <h2>Latest Episode</h2>
        <div class="tabs" id="latest-tabs">
          <button class="on" data-tab="all" type="button">All</button>
          <button data-tab="trending" type="button">Trending</button>
          <button data-tab="random" type="button">Random</button>
        </div>
      </div>
      <div class="lgrid" id="latest-grid"></div>
      <div class="pager" id="latest-pager"></div>
    </section>

    <aside class="popular" aria-label="Top anime">
      <div class="pop-box">
        <div class="panel-h" style="margin-bottom:12px">
          <h2>Top anime</h2>
          <div class="tabs" id="pop-tabs">
            <button class="on" data-range="today" type="button">Day</button>
            <button data-range="week" type="button">Week</button>
            <button data-range="month" type="button">Month</button>
          </div>
        </div>
        <div id="pop-body"></div>
      </div>
    </aside>

    <section class="schedule" id="schedule" aria-label="Schedule">
      <div class="sched-box">
        <div class="sched-head">
          <h2>Estimated Schedule <small id="now-clock"></small></h2>
          <div class="days-row">
            <button class="arrow" id="days-prev" type="button" aria-label="Previous days"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <div class="days" id="days"></div>
            <button class="arrow" id="days-next" type="button" aria-label="Next days"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
          </div>
        </div>
        <div class="sched-list" id="sched-list"></div>
        <div class="sched-note">Times are shown as provided by the source and may differ from your timezone.</div>
      </div>
    </section>

  </div>
</main>

<div id="site-footer"></div>

<script src="assets/nav.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/fx-recipes.js"></script>
<script src="assets/decorations.js"></script>
<script src="assets/bannerfx.js"></script>
<script src="assets/site.js"></script>
<script src="assets/home.js"></script>
</body>
</html>
