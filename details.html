<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="apple-touch-icon" href="assets/favicon.svg">

<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/effects.css">
<link rel="stylesheet" href="assets/decorations.css">
<link rel="stylesheet" href="assets/bannerfx.css">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body{ position:relative; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:2px; }
  .btn-row .btn{ padding:13px 20px; font-size:14.5px; }

  /* ---------- HERO BACKDROP ---------- */
  .hero-backdrop{
    position:absolute;
    top:0; left:0; right:0;
    height:460px;
    background-size:cover;
    background-position:center 25%;
    opacity:0;
    transition: opacity .5s ease;
    z-index:0;
    pointer-events:none;
  }
  .hero-backdrop.visible{ opacity:1; }
  .hero-backdrop::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, #0f0e1322 0%, #0f0e13 92%);
  }

  .wrap{ max-width:900px; margin:0 auto; padding:26px 18px 0; position:relative; z-index:1; }

  /* ---------- SKELETON STATE ---------- */
  .details-skeleton{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:26px;
  }
  .details-skeleton .skeleton-poster{ aspect-ratio:2/3; border-radius:12px; }
  .details-skeleton .lines{ display:flex; flex-direction:column; gap:10px; padding-top:6px; }
  .details-skeleton .skeleton-line.h1{ height:22px; width:70%; }
  .details-skeleton .skeleton-line.h2{ height:12px; width:45%; }

  .error-box{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:13.5px;
  }
  .error-box .err-title{ color:#ff6b86; font-family:var(--font-display); font-size:17px; margin-bottom:8px; }

  /* ---------- DETAILS CONTENT ---------- */
  .details-content{ display:none; }
  .details-content.visible{ display:block; }

  .details-top{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:26px;
    margin-bottom:8px;
  }
  .poster{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    aspect-ratio:2/3;
    background:var(--bg-raise);
    box-shadow: 0 20px 40px -20px #000000cc;
  }
  .poster img{ width:100%; height:100%; object-fit:cover; display:block; }

  .details-main h1{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    line-height:1.18;
    margin-bottom:4px;
  }
  .details-main .alt-title{ color:var(--muted); font-size:13.5px; margin-bottom:2px; }
  .native-title{ color:var(--muted); font-size:12.5px; font-family:var(--font-mono); margin-bottom:16px; }

  .meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{
    font-family:var(--font-mono); font-size:11.5px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); background:var(--bg-raise);
  }
  .chip.score{ color:var(--caramel); border-color:#ffbe3b55; }
  .chip.airing{ color:var(--kaiju-green); border-color:#38d6a055; display:flex; align-items:center; gap:5px; }
  .chip.finished{ color:var(--telegram); border-color:#3fa8e855; }
  .chip.airing .dot{ width:5px; height:5px; border-radius:50%; background:var(--kaiju-green); box-shadow:0 0 6px var(--kaiju-green); }
  .chip.episodes{ color:var(--text); }

  #watch-btn{ margin-top:2px; }

  .description{
    margin-top:24px;
    font-size:14.5px;
    line-height:1.7;
    color:#e8dcc8;
    max-width:68ch;
  }

  .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:18px; }
  .tag{ font-size:12px; padding:5px 11px; border-radius:7px; background:var(--bg-raise); border:1px solid var(--line); color:var(--text); }
  .tag.genre{ border-color:#ff5a3644; color:var(--blush); }

  @media (max-width: 620px){
    .details-top, .details-skeleton{ grid-template-columns:120px 1fr; gap:16px; }
    .details-main h1{ font-size:20px; }
    .poster{ max-width:120px; }
    .hero-backdrop{ height:280px; }
  }
</style>
</head>

<div class="wrap">

  <!-- SKELETON -->
  <div class="details-skeleton" id="skeleton">
    <div class="skeleton-poster"></div>
    <div class="lines">
      <div class="skeleton-line h1"></div>

  <!-- ERROR -->
  <div class="error-box" id="error-box" style="display:none;">
    <div class="err-title">Couldn't load this anime</div>

  <!-- DETAILS -->
  <div class="details-content" id="details-content">

      <div class="poster">

      <div class="details-main">

        <div class="btn-row">

    <div class="tags" id="d-tags"></div>

</div>
