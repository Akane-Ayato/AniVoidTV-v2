<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnivoidTV — Details</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/site.css">
<style>
  body{ position:relative; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:2px; }
  .btn-row .btn{ padding:13px 20px; font-size:14.5px; }

  /* ---------- HERO BACKDROP ---------- */
  .hero-backdrop{
    position:absolute;
    top:0; left:0; right:0;
    height:460px;
    background-size:cover;
    background-position:center 25%;
    opacity:0;
    transition: opacity .5s ease;
    z-index:0;
    pointer-events:none;
  }
  .hero-backdrop.visible{ opacity:1; }
  .hero-backdrop::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, #14111a22 0%, #14111a 92%);
  }

  .wrap{ max-width:900px; margin:0 auto; padding:26px 18px 0; position:relative; z-index:1; }

  /* ---------- SKELETON STATE ---------- */
  .details-skeleton{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:26px;
  }
  .details-skeleton .skeleton-poster{ aspect-ratio:2/3; border-radius:12px; }
  .details-skeleton .lines{ display:flex; flex-direction:column; gap:10px; padding-top:6px; }
  .details-skeleton .skeleton-line.h1{ height:22px; width:70%; }
  .details-skeleton .skeleton-line.h2{ height:12px; width:45%; }

  .error-box{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:13.5px;
  }
  .error-box .err-title{ color:#ff6b6b; font-family:var(--font-display); font-size:17px; margin-bottom:8px; }

  /* ---------- DETAILS CONTENT ---------- */
  .details-content{ display:none; }
  .details-content.visible{ display:block; }

  .details-top{
    display:grid;
    grid-template-columns:190px 1fr;
    gap:26px;
    margin-bottom:8px;
  }
  .poster{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    aspect-ratio:2/3;
    background:var(--bg-raise);
    box-shadow: 0 20px 40px -20px #000000cc;
  }
  .poster img{ width:100%; height:100%; object-fit:cover; display:block; }

  .details-main h1{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    line-height:1.18;
    margin-bottom:4px;
  }
  .details-main .alt-title{ color:var(--muted); font-size:13.5px; margin-bottom:2px; }
  .native-title{ color:var(--muted); font-size:12.5px; font-family:var(--font-mono); margin-bottom:16px; }

  .meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .chip{
    font-family:var(--font-mono); font-size:11.5px; padding:5px 10px; border-radius:999px;
    border:1px solid var(--line); color:var(--muted); background:var(--bg-raise);
  }
  .chip.score{ color:var(--caramel); border-color:#e8a85455; }
  .chip.airing{ color:var(--kaiju-green); border-color:#6fd6a055; display:flex; align-items:center; gap:5px; }
  .chip.finished{ color:var(--telegram); border-color:#3fa8e855; }
  .chip.airing .dot{ width:5px; height:5px; border-radius:50%; background:var(--kaiju-green); box-shadow:0 0 6px var(--kaiju-green); }
  .chip.episodes{ color:var(--text); }

  #watch-btn{ margin-top:2px; }

  .description{
    margin-top:24px;
    font-size:14.5px;
    line-height:1.7;
    color:#d8d2e0;
    max-width:68ch;
  }

  .tags{ display:flex; flex-wrap:wrap; gap:7px; margin-top:18px; }
  .tag{ font-size:12px; padding:5px 11px; border-radius:7px; background:var(--bg-raise); border:1px solid var(--line); color:var(--text); }
  .tag.genre{ border-color:#ff6fa544; color:var(--blush); }

  @media (max-width: 620px){
    .details-top, .details-skeleton{ grid-template-columns:120px 1fr; gap:16px; }
    .details-main h1{ font-size:20px; }
    .poster{ max-width:120px; }
    .hero-backdrop{ height:280px; }
  }
</style>
</head>
<body>

<div class="hero-backdrop" id="hero-backdrop"></div>

<nav class="navbar">
  <a class="logo" href="home.html">
    <img class="logo-mark" src="assets/logo.jpg" alt="AnikotoTV logo">
    <div class="logo-word">Anivoid<span>TV</span></div>
  </a>
  <div class="nav-right">
    <button class="hamburger" id="menu-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="nav-overlay" id="nav-overlay"></div>
<aside class="nav-drawer" id="nav-drawer">
  <div class="drawer-head">
    <img class="logo-mark" src="assets/logo.jpg" alt="AnikotoTV logo">
    <div class="logo-word">Anivoid<span>TV</span></div>
  </div>
  <a class="drawer-link" data-page="home.html" href="home.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    Home
  </a>
  <a class="drawer-link" data-page="recent.html" href="recent.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    Recent
  </a>
  <a class="drawer-link" data-page="aired.html" href="aired.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>Finished Anime</a>
  <a class="drawer-link" data-page="upcoming.html" href="upcoming.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Upcoming Anime</a>
  <a class="drawer-link" data-page="search.html" href="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search</a>
  <a class="drawer-link" data-page="index.html" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Watch by ID</a>
  <a class="drawer-link" data-telegram-link href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.6c.2-1-.6-1.8-1.5-1.4L2.4 10.7c-1 .4-1 1.9.1 2.2l4.4 1.4 1.7 5.4c.2.7 1 .9 1.6.4l2.5-2.2 4.6 3.4c.8.6 1.9.1 2.1-.8l3.5-15.9z"/></svg>
    Telegram
  </a>
  <a class="drawer-link" data-contact-link href="#" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    Support
  </a>
  <div class="drawer-foot">AnivoidTV · Free anime embeds</div>
</aside>

<div class="wrap">

  <!-- SKELETON -->
  <div class="details-skeleton" id="skeleton">
    <div class="skeleton-poster"></div>
    <div class="lines">
      <div class="skeleton-line h1"></div>
      <div class="skeleton-line h2"></div>
      <div class="skeleton-line" style="width:50%"></div>
      <div class="skeleton-line" style="width:90%"></div>
      <div class="skeleton-line" style="width:80%"></div>
      <div class="skeleton-line" style="width:40%"></div>
    </div>
  </div>

  <!-- ERROR -->
  <div class="error-box" id="error-box" style="display:none;">
    <div class="err-title">Couldn't load this anime</div>
    <div id="error-message">Try again in a moment, or head back to Recent.</div>
  </div>

  <!-- DETAILS -->
  <div class="details-content" id="details-content">
    <div class="details-top">
      <div class="poster">
        <img id="d-poster" src="" alt="">
      </div>
      <div class="details-main">
        <h1 id="d-title"></h1>
        <div class="alt-title" id="d-alt"></div>
        <div class="native-title" id="d-native"></div>
        <div class="meta-row" id="d-meta"></div>
        <div class="btn-row">
          <button id="watch-btn" class="primary-btn" onclick="goWatch()">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Watch Now
        </button>
          <div id="list-host"></div>
        </div>
      </div>
    </div>

    <p class="description" id="d-description"></p>
    <div class="tags" id="d-tags"></div>

    <section class="comments" id="comments" aria-label="Comments"></section>
  </div>

</div>

<div id="site-footer"></div>

<script src="assets/nav.js"></script>
<script src="assets/site.js"></script>
<script src="assets/community.js"></script>
<script>
  const API_BASE = "/api/series";

  const id = new URLSearchParams(location.search).get("id");

  const skeleton = document.getElementById("skeleton");
  const errorBox = document.getElementById("error-box");
  const errorMessage = document.getElementById("error-message");
  const detailsContent = document.getElementById("details-content");
  const heroBackdrop = document.getElementById("hero-backdrop");

  function capitalize(s){
    return typeof s === "string" && s.length ? s[0].toUpperCase() + s.slice(1) : s;
  }

  function makeTag(text, isGenre){
    const span = document.createElement("span");
    span.className = "tag" + (isGenre ? " genre" : "");
    span.textContent = text;
    return span;
  }

  function showError(msg){
    skeleton.style.display = "none";
    detailsContent.classList.remove("visible");
    errorBox.style.display = "block";
    errorMessage.textContent = msg;
  }

  function renderDetails(anime, episodeCount){
    document.getElementById("d-poster").src = anime.poster || "";
    document.getElementById("d-poster").alt = (anime.title || "Anime") + " poster";
    document.getElementById("d-title").textContent = anime.title || "Untitled";
    document.getElementById("d-alt").textContent = anime.alternative || "";
    document.getElementById("d-alt").style.display = anime.alternative ? "block" : "none";
    document.getElementById("d-native").textContent = anime.native || "";
    document.getElementById("d-native").style.display = anime.native ? "block" : "none";
    document.getElementById("d-description").textContent = anime.description
      ? anime.description.replace(/\(Source:.*?\)/i, "").trim()
      : "No synopsis available.";

    const meta = document.getElementById("d-meta");
    meta.innerHTML = "";
    const chips = [];
    if(anime.status){
      if(/airing/i.test(anime.status)) chips.push({ html: '<span class="dot"></span>Airing', cls: "airing" });
      else if(/finish|complet/i.test(anime.status)) chips.push({ text: "Finished", cls: "finished" });
      else chips.push({ text: anime.status });
    }
    if(anime.score) chips.push({ text: "★ " + anime.score, cls: "score" });
    const type = anime.terms_by_type && anime.terms_by_type.type && anime.terms_by_type.type[0];
    if(type) chips.push({ text: type });
    if(anime.season && anime.year) chips.push({ text: capitalize(anime.season) + " " + anime.year });
    if(episodeCount) chips.push({ text: episodeCount + (episodeCount === 1 ? " episode" : " episodes"), cls: "episodes" });
    if(anime.aired) chips.push({ text: "Aired " + anime.aired });

    chips.forEach(c => {
      const span = document.createElement("span");
      span.className = "chip" + (c.cls ? " " + c.cls : "");
      if(c.html) span.innerHTML = c.html; else span.textContent = c.text;
      meta.appendChild(span);
    });

    const tagsWrap = document.getElementById("d-tags");
    tagsWrap.innerHTML = "";
    const genres = (anime.terms_by_type && anime.terms_by_type.genre) || [];
    const studios = (anime.terms_by_type && anime.terms_by_type.studios) || [];
    genres.forEach(g => tagsWrap.appendChild(makeTag(g, true)));
    studios.forEach(s => tagsWrap.appendChild(makeTag(s, false)));
    if(anime.source) tagsWrap.appendChild(makeTag("Source: " + capitalize(anime.source), false));

    if(anime.background_image){
      heroBackdrop.style.backgroundImage = `url(${anime.background_image})`;
      heroBackdrop.classList.add("visible");
    }

    document.title = (anime.title || "Details") + " — AnikotoTV";
    window.dispatchEvent(new CustomEvent("avtv:anime", { detail: { id: id, anime: anime } }));
  }

  function goWatch(){
    window.location.href = "watch.html?id=" + encodeURIComponent(id);
  }

  async function load(){
    if(!id){
      showError("No anime ID was given. Go back and pick a show from Recent.");
      return;
    }

    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(API_BASE + "/" + encodeURIComponent(id), {
        signal: controller.signal,
        headers: { Accept: "application/json" }
      });
      clearTimeout(timer);
      if(!res.ok) throw new Error("HTTP " + res.status);

      const json = await res.json();
      if(!json.ok || !json.data || !json.data.anime){
        throw new Error(json.message || "Anime not found");
      }

      const episodeCount = (json.data.episodes || []).length;

      skeleton.style.display = "none";
      renderDetails(json.data.anime, episodeCount);
      detailsContent.classList.add("visible");

    } catch(err){
      showError("Try again in a moment, or head back to Recent.");
    }
  }

  load();

  // Basic inspect deterrents — cosmetic only
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    const k = e.key;
    if(k === "F12" || (e.ctrlKey && e.shiftKey && (k === "I" || k === "J" || k === "C")) || (e.ctrlKey && k === "U")){
      e.preventDefault();
    }
  });
</script>

</body>
</html>
