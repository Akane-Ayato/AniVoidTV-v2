  .page-head p{ color:var(--muted); font-size:13.5px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap:16px;
  }

  .grid-status{
    text-align:center;
    padding:40px 0;
    color:var(--muted);
    font-family:var(--font-mono);
    font-size:13px;
  }
  .grid-status.err{ color:#ff6b86; }

  @media (max-width:520px){
    .grid{ grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap:12px; }
    .wrap{ padding:20px 14px 32px; }
  }
</style>
